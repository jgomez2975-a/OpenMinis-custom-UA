name: Build TrollStore TIPA

on:
  workflow_dispatch:
  push:
    branches: [main, minis-custom-video]

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode and install tools
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          brew install ninja llvm lld libarchive pkg-config meson

      - name: Prepare build configuration
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/ffmpeg-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: ios-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/build_lame.sh', 'deps/build_ffmpeg.sh', 'deps/build_ish.sh', 'deps/build_rclone_ios.sh', 'deps/prepare_alpine_rootfs.sh', '.gitmodules') }}

      - name: Build native dependencies
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/build_rclone_ios.sh
          ./deps/prepare_alpine_rootfs.sh

      - name: Build unsigned device app
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package TIPA
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Minis.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Minis-GoDog-custom.tipa" Payload
          shasum -a 256 "$GITHUB_WORKSPACE/Minis-GoDog-custom.tipa" > "$GITHUB_WORKSPACE/Minis-GoDog-custom.tipa.sha256"

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: Minis-GoDog-custom-tipa
          path: |
            Minis-GoDog-custom.tipa
            Minis-GoDog-custom.tipa.sha256
          if-no-files-found: error
          retention-days: 30
