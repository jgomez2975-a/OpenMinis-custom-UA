name: Build unsigned TIPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: deps/rclone-mobile/go.mod
          cache-dependency-path: deps/rclone-mobile/go.sum

      - name: Install native build tools
        run: |
          brew install ninja llvm lld libarchive pkg-config
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          ln -sf "$(brew --prefix lld)/bin/ld.lld" "$(brew --prefix llvm)/bin/ld.lld"
          python3 -m pip install --break-system-packages meson

      - name: Prepare build customization
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Cache native dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: ios-native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps/build_lame.sh', 'deps/build_ffmpeg.sh', 'deps/build_ish.sh', 'deps/build_rclone_ios.sh', 'deps/prepare_alpine_rootfs.sh', '.gitmodules') }}

      - name: Build native dependencies
        run: |
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/build_rclone_ios.sh
          ./deps/prepare_alpine_rootfs.sh

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package TIPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Minis.app"
          test -d "$APP_PATH"
          test -x "$APP_PATH/Minis"
          rm -rf build/Payload
          mkdir -p build/Payload
          ditto "$APP_PATH" build/Payload/Minis.app
          cd build
          /usr/bin/zip -qry OpenMinis-CustomUA-unsigned.tipa Payload
          shasum -a 256 OpenMinis-CustomUA-unsigned.tipa > OpenMinis-CustomUA-unsigned.tipa.sha256

      - name: Upload TIPA
        uses: actions/upload-artifact@v4
        with:
          name: OpenMinis-CustomUA-unsigned
          path: |
            build/OpenMinis-CustomUA-unsigned.tipa
            build/OpenMinis-CustomUA-unsigned.tipa.sha256
          if-no-files-found: error
          retention-days: 30
